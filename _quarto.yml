project:
  type: website
  execute-dir: project
  output-dir: docs
  render:
    - "*.qmd"

execute: 
  freeze: auto

website:
  title: '"AI in a Day" Workshop Materials'
  repo-url: https://github.com/CU-ESIIL/AI-in-a-day
  repo-actions: [issue]
  navbar:
    background: primary
    left:
      - text: "Home"
        href: index.qmd
    right: 
      - text: "Glossary"
        href: glossary.qmd
      - icon: github
        href: https://github.com/CU-ESIIL/AI-in-a-day
  sidebar:
    style: docked
    contents:
      - text: "Home"
        href: index.qmd
      - section: "Workshop Modules"
        contents:
            - text: "Template"
              href: mod-template.qmd
  page-footer: 
    center: "Copyright &copy; 2026, University of Colorado Boulder <br> Materials made with [Quarto](https://quarto.org/)"
    background: secondary

format:
  html:
    theme:
      light: theme_light.scss
      dark: theme_dark.scss
    mainfont: Open Sans
    toc: true
    link-external-newwindow: true
    link-external-icon: true
