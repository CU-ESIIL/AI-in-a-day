project:
  type: website
  execute-dir: project
  output-dir: docs
  render:
    - "*.qmd"

execute: 
  freeze: auto

website:
  title: '"AI in a Day" Workshop Materials'
  repo-url: https://github.com/CU-ESIIL/AI-in-a-day
  repo-actions: [issue]
  favicon: /topics/images/logo/esiil.png
  navbar:
    background: primary
    right: 
      - icon: github
        href: https://github.com/CU-ESIIL/AI-in-a-day
  sidebar:
    style: docked
    contents:
      - text: "Home"
        href: index.qmd
      - section: "Workshop Modules"
        contents:
            - text: "1. GenAI Fundamentals"
              href: mod-01.qmd
            - text: "2. Literature Review & Research Questions"
              href: mod-02.qmd
            - text: "3.  Methods & Results"
              href: mod-03.qmd
            - text: "4. Discussion & Publication"
              href: mod-04.qmd
            - text: "5. Ethics & Responsibility"
              href: mod-05.qmd
      - text: "Glossary"
        href: glossary.qmd

  page-footer: 
    center: "Copyright &copy; 2026, University of Colorado Boulder <br> Materials made with [Quarto](https://quarto.org/)"
    background: secondary

format:
  html:
    theme:
      light: theme_light.scss
      dark: theme_dark.scss
    mainfont: Open Sans
    toc: true
    link-external-newwindow: true
    link-external-icon: true
